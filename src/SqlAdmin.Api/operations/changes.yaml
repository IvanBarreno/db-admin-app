# operations/changes.yaml — modify existing logins/users (§2 "Changes").
# Same dynamic-SQL pattern as provisioning.yaml: values are bound parameters, QUOTENAME escapes
# them into the statement, Choice values are validated by TemplateRenderer.
# Nothing here drops a login or user (that is offboarding.yaml). Operations that REMOVE access
# (role DROP, permission REVOKE/DENY, disabling a login) use destructive / destructive_when, so
# they need the previewed confirm token; adding access does not.

operations:
  - id: changes.reset_password
    name: "Reset login password"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
      # Blank = the server generates a strong password and shows it once after the run.
      - name: password
        type: password
        required: false
        generate: true
      - name: unlock
        type: bool
        required: false
        default: "false"
    sql: |
      IF LEN(@password) > 128 THROW 50000, N'Passwords longer than 128 characters are not supported.', 1;
      DECLARE @sql nvarchar(max) = N'ALTER LOGIN ' + QUOTENAME(@login_name)
        + N' WITH PASSWORD = ' + QUOTENAME(@password, '''')
        + CASE WHEN @unlock = 1 THEN N' UNLOCK' ELSE N'' END;
      EXEC (@sql);
      SELECT name AS login_name, is_disabled, modify_date
      FROM sys.server_principals
      WHERE name = @login_name;

  - id: changes.set_login_enabled
    name: "Enable / disable login"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [DISABLE] }
    params:
      - name: login_name
        type: login
        required: true
      - name: action
        type: choice
        required: true
        choices: [ENABLE, DISABLE]
    sql: |
      DECLARE @sql nvarchar(max) = N'ALTER LOGIN ' + QUOTENAME(@login_name) + N' ' + @action;
      EXEC (@sql);
      SELECT name AS login_name, is_disabled, modify_date
      FROM sys.server_principals
      WHERE name = @login_name;

  - id: changes.server_role_member
    name: "Add / remove server role membership"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [DROP] }
    params:
      - name: login_name
        type: login
        required: true
      - name: role_name
        type: choice
        required: true
        choices: [sysadmin, securityadmin, serveradmin, setupadmin, processadmin, diskadmin, dbcreator, bulkadmin]
      - name: action
        type: choice
        required: true
        choices: [ADD, DROP]
    sql: |
      DECLARE @sql nvarchar(max) = N'ALTER SERVER ROLE ' + QUOTENAME(@role_name)
        + N' ' + @action + N' MEMBER ' + QUOTENAME(@login_name);
      EXEC (@sql);
      SELECT r.name AS server_role, m.name AS login_name
      FROM sys.server_role_members srm
      JOIN sys.server_principals r ON r.principal_id = srm.role_principal_id
      JOIN sys.server_principals m ON m.principal_id = srm.member_principal_id
      WHERE m.name = @login_name
      ORDER BY r.name;

  - id: changes.server_permission
    name: "Grant / revoke / deny a server permission"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [REVOKE, DENY] }
    params:
      - name: login_name
        type: login
        required: true
      - name: permission
        type: choice
        required: true
        choices: [CONNECT SQL, VIEW ANY DATABASE, VIEW ANY DEFINITION, VIEW SERVER STATE, ALTER ANY LOGIN, ALTER ANY DATABASE]
      - name: action
        type: choice
        required: true
        choices: [GRANT, REVOKE, DENY]
    sql: |
      DECLARE @sql nvarchar(max) = @action + N' ' + @permission
        + CASE WHEN @action = N'REVOKE' THEN N' FROM ' ELSE N' TO ' END
        + QUOTENAME(@login_name);
      EXEC (@sql);
      SELECT permission_name, state_desc
      FROM sys.server_permissions
      WHERE grantee_principal_id = SUSER_ID(@login_name)
      ORDER BY permission_name;

  - id: changes.rename_user
    name: "Rename database user (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
      - name: new_name
        type: string
        required: true
    sql: |
      DECLARE @sql nvarchar(max) = N'ALTER USER ' + QUOTENAME(@user_name) + N' WITH NAME = ' + QUOTENAME(@new_name);
      EXEC (@sql);
      SELECT name AS user_name, type_desc, modify_date
      FROM sys.database_principals
      WHERE name = @new_name;

  - id: changes.database_role_member
    name: "Add / remove database role membership (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [DROP] }
    params:
      - name: user_name
        type: user
        required: true
      - name: role_name
        type: string
        required: true
      - name: action
        type: choice
        required: true
        choices: [ADD, DROP]
    sql: |
      DECLARE @sql nvarchar(max) = N'ALTER ROLE ' + QUOTENAME(@role_name)
        + N' ' + @action + N' MEMBER ' + QUOTENAME(@user_name);
      EXEC (@sql);
      SELECT r.name AS database_role, m.name AS user_name
      FROM sys.database_role_members drm
      JOIN sys.database_principals r ON r.principal_id = drm.role_principal_id
      JOIN sys.database_principals m ON m.principal_id = drm.member_principal_id
      WHERE m.name = @user_name
      ORDER BY r.name;

  - id: changes.fix_orphaned_user
    name: "Fix orphaned user: remap to login (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
      - name: login_name
        type: login
        required: false
        default: ""
    sql: |
      -- Blank login = the login with the same name as the user.
      DECLARE @l sysname = COALESCE(NULLIF(@login_name, N''), @user_name);
      DECLARE @sql nvarchar(max) = N'ALTER USER ' + QUOTENAME(@user_name) + N' WITH LOGIN = ' + QUOTENAME(@l);
      EXEC (@sql);
      SELECT u.name AS user_name, sp.name AS mapped_login
      FROM sys.database_principals u
      LEFT JOIN sys.server_principals sp ON sp.sid = u.sid
      WHERE u.name = @user_name;
