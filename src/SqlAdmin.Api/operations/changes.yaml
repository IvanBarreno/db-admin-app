# operations/changes.yaml — modify existing logins/users (§2 "Changes").
# Same dynamic-SQL pattern as provisioning.yaml: values are bound parameters, QUOTENAME escapes
# them into the statement, Choice values are validated by TemplateRenderer.
# Nothing here drops a login or user except drop_orphaned_users (offboarding.yaml drops logins). Operations
# that REMOVE access (role DROP, permission REVOKE/DENY, disabling) use destructive / destructive_when, so
# they need the previewed confirm token; adding access does not.
#
# LIST ("multi") parameters arrive as one JSON array and are read with OPENJSON(@name). Those operations
# share one loop: every item runs inside TRY/CATCH, so one failure does not hide the others; the grid says
# OK / ERROR / SKIPPED per item and the run fails at the end if any item failed. `stop_on_error` skips the
# rest after the first failure. In a dry run ({{exec:...}} only SELECTs the statement) an item that would
# fail is shown as a "-- item: reason" line instead.

operations:
  - id: changes.reset_password
    name: "Reset login password"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
        must_exist: true
        # Only SQL logins have a password; Windows / AD logins and groups are managed by Windows.
        lock_when:
          - column: type
            not_in: [SQL_LOGIN]
            reason: "no password to reset: managed by Windows / AD"
      # Blank = the server generates a strong password and shows it once after the run.
      - name: password
        type: password
        required: false
        generate: true
      - name: unlock
        type: bool
        required: false
        default: "false"
    checks:
      - id: sql_login_only
        message: "Only SQL logins have a password. Windows / AD logins are managed by Windows."
        sql: |
          SELECT 1 FROM sys.server_principals WHERE name = @login_name AND type <> 'S';
    sql: |
      IF LEN(@password) > 128 THROW 50000, N'Passwords longer than 128 characters are not supported.', 1;
      DECLARE @sql nvarchar(max) = N'ALTER LOGIN ' + QUOTENAME(@login_name)
        + N' WITH PASSWORD = ' + QUOTENAME(@password, '''')
        + CASE WHEN @unlock = 1 THEN N' UNLOCK' ELSE N'' END;
      {{exec:@sql}};
      SELECT name AS login_name, is_disabled, modify_date
      FROM sys.server_principals
      WHERE name = @login_name;

  # Bulk variant: a DIFFERENT generated password for every ticked login (generate_for_each). The passwords come
  # back in the result grid, only for the logins that were really changed, and are never written to the audit log.
  - id: changes.reset_passwords
    name: "Reset passwords of several logins"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: true   # every application using these logins stops connecting until it gets the new password
    description: "Gives each ticked SQL login a new password: type one per login or leave it empty to have a different one generated. Generated passwords are shown once in the result table (use Export CSV to hand them over); nothing is stored anywhere."
    params:
      - name: logins
        type: string
        source: logins
        multi: true
        required: true
        must_exist: true
        label: "Logins"
        help: "The SQL logins that get a new password. Windows / AD logins have no password here and are locked."
        lock_when:
          - column: type
            not_in: [SQL_LOGIN]
            reason: "no password to reset: managed by Windows / AD"
      # One password per ticked login: typed in its row, or generated by the app at execute time when left empty.
      # The form sends only the typed ones ({"login": "password"}); see OperationExecutor.ApplyGeneratedSecrets.
      - name: passwords
        type: password
        required: false
        generate_for_each: logins
        label: "New passwords"
        help: "Typed per login, or generated by the app when the run starts if left empty. Generated ones are shown once in the results."
      - name: unlock
        type: bool
        required: false
        default: "false"
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), item nvarchar(256));
      INSERT @items (item) SELECT value FROM OPENJSON(@logins);
      -- From the app: {"login": {"p": "password", "g": true|false}}; g = the app generated it (false = the DBA
      -- typed it). In a dry run the value is masked (not JSON), so it is not read.
      DECLARE @secrets TABLE (item nvarchar(256), secret nvarchar(128), generated bit);
      IF @dry_run = 0
        INSERT @secrets (item, secret, generated)
        SELECT [key], JSON_VALUE([value], '$.p'), CASE WHEN JSON_VALUE([value], '$.g') = N'true' THEN 1 ELSE 0 END
        FROM OPENJSON(@passwords);
      DECLARE @results TABLE (item nvarchar(256), status varchar(7), secret nvarchar(128), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @item nvarchar(256), @secret nvarchar(128),
              @generated bit, @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @item = item FROM @items WHERE n = @n;
        SELECT @secret = NULL, @generated = 0;
        IF @dry_run = 1 SET @secret = N'***';
        ELSE SELECT @secret = secret, @generated = generated FROM @secrets WHERE item = @item;
        BEGIN TRY
          IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = @item AND type = 'S')
            THROW 50000, N'Not a SQL login (it does not exist, or its password is managed by Windows / AD).', 1;
          IF @secret IS NULL THROW 50000, N'No password was generated for this login.', 1;
          SET @sql = N'ALTER LOGIN ' + QUOTENAME(@item) + N' WITH PASSWORD = ' + QUOTENAME(@secret, '''')
            + CASE WHEN @unlock = 1 THEN N' UNLOCK' ELSE N'' END + N';';
          {{exec:@sql}};
          -- The password is reported only here, for a login whose ALTER LOGIN really succeeded, and only when
          -- the app generated it: one the DBA typed is already known and stays off the screen and the CSV.
          INSERT @results VALUES (@item, 'OK',
            CASE WHEN @dry_run = 1 THEN NULL WHEN @generated = 1 THEN @secret ELSE N'(as typed)' END, NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, 'ERROR', NULL, ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, 'SKIPPED', NULL, NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS login_name, status, secret AS new_password, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some logins failed: see the table. Passwords shown are already in effect.', 1;

  - id: changes.set_login_enabled
    name: "Enable / disable login"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [DISABLE] }
    params:
      - name: login_name
        type: login
        required: true
        must_exist: true
      # The form asks the server whether the login is disabled right now and preselects the opposite action.
      - name: action
        type: choice
        required: true
        choices: [ENABLE, DISABLE]
        suggest: { lookup: login_status, column: is_disabled, depends_on: [login_name], map: { "true": ENABLE, "false": DISABLE } }
    checks:
      - id: not_self
        message: "You cannot disable the login you are connected with."
        sql: |
          SELECT 1 WHERE @action = 'DISABLE' AND @login_name IN (ORIGINAL_LOGIN(), SUSER_SNAME());
    sql: |
      DECLARE @sql nvarchar(max) = N'ALTER LOGIN ' + QUOTENAME(@login_name) + N' ' + @action;
      {{exec:@sql}};
      SELECT name AS login_name, is_disabled, modify_date
      FROM sys.server_principals
      WHERE name = @login_name;

  - id: changes.set_logins_enabled
    name: "Enable / disable several logins"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [DISABLE] }
    params:
      # Pick the action FIRST: the list below then locks the logins that are already in that state.
      - name: action
        type: choice
        required: true
        choices: [ENABLE, DISABLE]
      - name: logins
        type: string
        source: logins
        multi: true
        required: true
        must_exist: true
        lock_when:
          - column: is_disabled
            in: ["false"]
            reason: "already enabled"
            if_param: action
            if_value: ENABLE
          - column: is_disabled
            in: ["true"]
            reason: "already disabled"
            if_param: action
            if_value: DISABLE
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    checks:
      - id: not_self
        message: "You cannot disable the login you are connected with."
        sql: |
          SELECT 1 WHERE @action = 'DISABLE'
            AND EXISTS (SELECT 1 FROM OPENJSON(@logins) WHERE value IN (ORIGINAL_LOGIN(), SUSER_SNAME()));
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), act varchar(10), item nvarchar(256));
      INSERT @items (act, item) SELECT @action, value FROM OPENJSON(@logins);
      DECLARE @results TABLE (item nvarchar(256), act varchar(10), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @act varchar(10), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @act = act, @item = item FROM @items WHERE n = @n;
        SET @sql = N'ALTER LOGIN ' + QUOTENAME(@item) + N' ' + @act + N';';
        BEGIN TRY
          {{exec:@sql}};
          INSERT @results VALUES (@item, @act, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, @act, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, act, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS login_name, act AS action, status, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some logins failed: see the table.', 1;

  - id: changes.server_roles
    name: "Server roles of a login (checklist)"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    # Only taking a role AWAY needs the confirm token; the form sends the difference between the ticks and
    # the current membership, so adding roles alone runs without it.
    destructive_when: { param: roles_to_drop, not_empty: true }
    params:
      - name: login_name
        type: login
        required: true
        must_exist: true
      - name: roles_to_add
        type: string
        source: server_roles
        depends_on: [login_name]
        multi: true
        required: false
        must_exist: true
        checklist_group: roles
        checklist_action: add
      - name: roles_to_drop
        type: string
        source: server_roles
        depends_on: [login_name]
        multi: true
        required: false
        must_exist: true
        checklist_group: roles
        checklist_action: drop
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), act varchar(10), item nvarchar(256));
      INSERT @items (act, item) SELECT 'ADD', value FROM OPENJSON(@roles_to_add);
      INSERT @items (act, item) SELECT 'DROP', value FROM OPENJSON(@roles_to_drop);
      DECLARE @results TABLE (item nvarchar(256), act varchar(10), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @act varchar(10), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @act = act, @item = item FROM @items WHERE n = @n;
        SET @sql = N'ALTER SERVER ROLE ' + QUOTENAME(@item) + N' ' + @act + N' MEMBER ' + QUOTENAME(@login_name) + N';';
        BEGIN TRY
          {{exec:@sql}};
          INSERT @results VALUES (@item, @act, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, @act, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, act, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS server_role, act AS action, status, message FROM @results;
      SELECT r.name AS server_role_now, m.name AS login_name
      FROM sys.server_role_members srm
      JOIN sys.server_principals r ON r.principal_id = srm.role_principal_id
      JOIN sys.server_principals m ON m.principal_id = srm.member_principal_id
      WHERE m.name = @login_name
      ORDER BY r.name;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some roles failed: see the table.', 1;

  - id: changes.server_permission
    name: "Grant / revoke / deny server permissions"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [REVOKE, DENY] }
    params:
      - name: login_name
        type: login
        required: true
        must_exist: true
      # The list of permissions comes from the server itself (sys.fn_builtin_permissions), not from the app.
      - name: permissions
        type: string
        source: server_permissions
        multi: true
        required: true
        must_exist: true
      - name: action
        type: choice
        required: true
        choices: [GRANT, REVOKE, DENY]
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), item nvarchar(256));
      INSERT @items (item) SELECT value FROM OPENJSON(@permissions);
      DECLARE @results TABLE (item nvarchar(256), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @item = item FROM @items WHERE n = @n;
        BEGIN TRY
          -- The permission name is concatenated unquoted, so it must be one the server itself lists.
          IF NOT EXISTS (SELECT 1 FROM sys.fn_builtin_permissions('SERVER') WHERE permission_name = @item)
            THROW 50011, N'Not a server permission of this SQL Server.', 1;
          SET @sql = @action + N' ' + @item
            + CASE WHEN @action = N'REVOKE' THEN N' FROM ' ELSE N' TO ' END
            + QUOTENAME(@login_name) + N';';
          {{exec:@sql}};
          INSERT @results VALUES (@item, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS permission_name, status, message FROM @results;
      SELECT permission_name, state_desc
      FROM sys.server_permissions
      WHERE grantee_principal_id = SUSER_ID(@login_name) AND class = 100
      ORDER BY permission_name;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some permissions failed: see the table.', 1;

  # Object-level permissions: tick permissions, then the objects and / or whole schemas they apply to.
  # One statement per (permission, object) pair. A permission that makes no sense for an object's kind
  # (EXECUTE on a table, INSERT on a procedure) is reported as SKIPPED instead of failing the run.
  - id: changes.object_permissions
    name: "Grant / revoke / deny permissions on objects or schemas"
    category: changes
    scope: database
    engines: [sqlserver]   # the T-SQL is the same on Azure SQL, but no change operation is offered there until it is tested
    destructive: false
    destructive_when: { param: action, values: [REVOKE, DENY] }
    description: "Grants, revokes or denies permissions (SELECT, EXECUTE…) to a user on the tables, views, procedures and functions you tick, or on whole schemas. Prefer a schema or a role when many objects are involved."
    params:
      - name: user_name
        type: user
        required: true
        must_exist: true
      - name: action
        type: choice
        required: true
        choices: [GRANT, REVOKE, DENY]
      - name: permissions
        type: string
        source: object_permissions
        multi: true
        required: true
        must_exist: true
      - name: objects
        type: string
        source: securables
        multi: true
        required: false
        must_exist: true
        label: "Objects"
        help: "Tables, views, procedures and functions the permissions apply to. A permission that does not fit an object's kind (EXECUTE on a table) is skipped for that object."
      - name: schemas
        type: string
        source: user_schemas
        multi: true
        required: false
        must_exist: true
        label: "Whole schemas"
        help: "A permission on a schema covers every object in it, including objects created later."
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      IF NOT EXISTS (SELECT 1 FROM OPENJSON(@objects)) AND NOT EXISTS (SELECT 1 FROM OPENJSON(@schemas))
        THROW 50000, N'Tick at least one object or one schema.', 1;
      DECLARE @grantee nvarchar(300) = QUOTENAME(@user_name),
              @to nvarchar(10) = CASE WHEN @action = N'REVOKE' THEN N' FROM ' ELSE N' TO ' END;

      -- One row per (target, permission). stmt stays NULL when the pair cannot be run; reason says why.
      DECLARE @items TABLE (n int IDENTITY(1,1), target nvarchar(600), permission_name nvarchar(128),
                            stmt nvarchar(max), reason nvarchar(400), is_error bit);

      -- Objects: found by their schema.name text, so no name parsing is needed (names may contain dots).
      INSERT @items (target, permission_name, stmt, reason, is_error)
      SELECT j.value, p.value,
             CASE WHEN o.object_id IS NOT NULL AND b.permission_name IS NOT NULL AND fits.ok = 1
                  THEN @action + N' ' + p.value + N' ON OBJECT::' + QUOTENAME(s.name) + N'.' + QUOTENAME(o.name) + @to + @grantee + N';' END,
             CASE WHEN o.object_id IS NULL THEN N'The object does not exist in this database.'
                  WHEN b.permission_name IS NULL THEN N'Not an object permission of this SQL Server.'
                  WHEN fits.ok = 0 THEN p.value + N' does not apply to a ' + LOWER(kind.name) + N'.' END,
             CASE WHEN o.object_id IS NULL OR b.permission_name IS NULL THEN 1 ELSE 0 END
      FROM OPENJSON(@objects) j
      CROSS JOIN OPENJSON(@permissions) p
      LEFT JOIN (sys.objects o JOIN sys.schemas s ON s.schema_id = o.schema_id)
             ON s.name + N'.' + o.name = j.value AND o.is_ms_shipped = 0
      -- The permission name is concatenated unquoted, so it must be one the server itself lists.
      LEFT JOIN (SELECT DISTINCT permission_name FROM sys.fn_builtin_permissions('OBJECT')) b ON b.permission_name = p.value
      CROSS APPLY (SELECT CASE WHEN o.type = 'U' THEN 'TABLE' WHEN o.type = 'V' THEN 'VIEW'
                               WHEN o.type IN ('P', 'PC') THEN 'PROCEDURE'
                               WHEN o.type IN ('FN', 'FS') THEN 'SCALAR FUNCTION'
                               ELSE 'TABLE FUNCTION' END AS name) kind
      -- Which permissions exist for which kind of object (SQL Server documentation, "Object permissions").
      CROSS APPLY (SELECT CASE
          WHEN p.value IN (N'CONTROL', N'TAKE OWNERSHIP', N'VIEW DEFINITION') THEN 1
          WHEN p.value = N'ALTER' THEN 1
          WHEN p.value = N'REFERENCES' AND kind.name <> 'PROCEDURE' THEN 1
          WHEN p.value = N'EXECUTE' AND kind.name IN ('PROCEDURE', 'SCALAR FUNCTION') THEN 1
          WHEN p.value IN (N'SELECT', N'INSERT', N'UPDATE', N'DELETE') AND kind.name IN ('TABLE', 'VIEW', 'TABLE FUNCTION') THEN 1
          WHEN p.value = N'VIEW CHANGE TRACKING' AND kind.name IN ('TABLE', 'VIEW') THEN 1
          ELSE 0 END AS ok) fits;

      -- Schemas: every object permission can be given on a schema (it then covers the objects inside).
      INSERT @items (target, permission_name, stmt, reason, is_error)
      SELECT N'schema ' + j.value, p.value,
             CASE WHEN s.schema_id IS NOT NULL AND b.permission_name IS NOT NULL
                  THEN @action + N' ' + p.value + N' ON SCHEMA::' + QUOTENAME(s.name) + @to + @grantee + N';' END,
             CASE WHEN s.schema_id IS NULL THEN N'The schema does not exist in this database.'
                  WHEN b.permission_name IS NULL THEN N'Not an object permission of this SQL Server.' END,
             CASE WHEN s.schema_id IS NULL OR b.permission_name IS NULL THEN 1 ELSE 0 END
      FROM OPENJSON(@schemas) j
      CROSS JOIN OPENJSON(@permissions) p
      LEFT JOIN sys.schemas s ON s.name = j.value
      LEFT JOIN (SELECT DISTINCT permission_name FROM sys.fn_builtin_permissions('OBJECT')) b ON b.permission_name = p.value;

      DECLARE @results TABLE (target nvarchar(600), permission_name nvarchar(128), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @sql nvarchar(max), @target nvarchar(600),
              @permission nvarchar(128), @reason nvarchar(400), @is_error bit, @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @sql = stmt, @target = target, @permission = permission_name, @reason = reason, @is_error = is_error
        FROM @items WHERE n = @n;
        BEGIN TRY
          IF @sql IS NULL AND @is_error = 1 THROW 50011, @reason, 1;
          IF @sql IS NULL
            INSERT @results VALUES (@target, @permission, 'SKIPPED', @reason);  -- does not apply: nothing to run
          ELSE
          BEGIN
            {{exec:@sql}};
            INSERT @results VALUES (@target, @permission, 'OK', NULL);
          END;
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @target + N' / ' + @permission + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@target, @permission, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT target, permission_name, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT target, permission_name, status, message FROM @results;
      -- What the user holds explicitly on objects and schemas after the run.
      SELECT dp.class_desc,
             CASE dp.class WHEN 1 THEN OBJECT_SCHEMA_NAME(dp.major_id) + N'.' + OBJECT_NAME(dp.major_id)
                           WHEN 3 THEN SCHEMA_NAME(dp.major_id) END AS securable,
             dp.permission_name, dp.state_desc
      FROM sys.database_permissions dp
      WHERE dp.grantee_principal_id = DATABASE_PRINCIPAL_ID(@user_name) AND dp.class IN (1, 3)
      ORDER BY dp.class, securable, dp.permission_name;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some permissions failed: see the table.', 1;

  # Database-level twin of "Clone server access": copies a user's database roles and explicit permissions
  # (database, schema, object and column level) to another user of the SAME database. It only adds.
  - id: changes.clone_database_access
    name: "Clone database access from another user"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    description: "Copies the database roles and explicit permissions of one user to another user of the selected database. Only adds what the target lacks; nothing is removed."
    params:
      - name: source_user
        type: user
        required: true
        must_exist: true
        protect: false
        label: "Copy from user"
        help: "The user whose database roles and permissions are copied. It is only read."
      - name: target_user
        type: user
        required: true
        must_exist: true
        label: "Copy to user"
        help: "The existing user that receives the access. It keeps what it already has."
      - name: include_roles
        type: bool
        required: false
        default: "true"
        label: "Copy database roles"
        help: "Adds the target to every database role the source belongs to (db_owner included, so check the preview)."
      - name: include_permissions
        type: bool
        required: false
        default: "true"
        label: "Copy explicit permissions"
        help: "Copies explicit GRANT / GRANT WITH GRANT OPTION / DENY on the database, its schemas, objects and columns. CONNECT is skipped."
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    checks:
      - id: different_users
        message: "Source and target are the same user."
        sql: |
          SELECT 1 WHERE @source_user = @target_user;
    sql: |
      DECLARE @src int = DATABASE_PRINCIPAL_ID(@source_user), @dst int = DATABASE_PRINCIPAL_ID(@target_user),
              @q nvarchar(300) = QUOTENAME(@target_user);
      IF @src IS NULL OR @dst IS NULL THROW 50000, N'Source or target user does not exist in this database.', 1;
      DECLARE @items TABLE (n int IDENTITY(1,1), kind varchar(10), item nvarchar(700), stmt nvarchar(max));
      IF @include_roles = 1
        INSERT @items (kind, item, stmt)
        SELECT 'ROLE', r.name, N'ALTER ROLE ' + QUOTENAME(r.name) + N' ADD MEMBER ' + @q + N';'
        FROM sys.database_role_members m
        JOIN sys.database_principals r ON r.principal_id = m.role_principal_id
        WHERE m.member_principal_id = @src
          AND NOT EXISTS (SELECT 1 FROM sys.database_role_members x
                          WHERE x.role_principal_id = m.role_principal_id AND x.member_principal_id = @dst);
      -- class 0 = the database itself, 1 = object or column (minor_id = column), 3 = schema.
      -- CONNECT is skipped: a user always needs it and the target already has it.
      IF @include_permissions = 1
        INSERT @items (kind, item, stmt)
        SELECT 'PERMISSION', p.permission_name + N' ON ' + t.label,
               CASE p.state WHEN 'D' THEN N'DENY ' ELSE N'GRANT ' END + p.permission_name + t.on_clause
                 + N' TO ' + @q + CASE WHEN p.state = 'W' THEN N' WITH GRANT OPTION' ELSE N'' END + N';'
        FROM sys.database_permissions p
        CROSS APPLY (SELECT
            CASE p.class
              WHEN 0 THEN N'DATABASE'
              WHEN 1 THEN OBJECT_SCHEMA_NAME(p.major_id) + N'.' + OBJECT_NAME(p.major_id)
                          + ISNULL(N' (' + COL_NAME(p.major_id, p.minor_id) + N')', N'')
              WHEN 3 THEN N'SCHEMA ' + SCHEMA_NAME(p.major_id) END AS label,
            CASE p.class
              WHEN 0 THEN N''
              WHEN 1 THEN N' ON OBJECT::' + QUOTENAME(OBJECT_SCHEMA_NAME(p.major_id)) + N'.' + QUOTENAME(OBJECT_NAME(p.major_id))
                          + ISNULL(N' (' + QUOTENAME(COL_NAME(p.major_id, p.minor_id)) + N')', N'')
              WHEN 3 THEN N' ON SCHEMA::' + QUOTENAME(SCHEMA_NAME(p.major_id)) END AS on_clause) t
        WHERE p.grantee_principal_id = @src AND p.class IN (0, 1, 3)
          AND NOT (p.class = 0 AND p.permission_name = N'CONNECT')
          AND NOT EXISTS (SELECT 1 FROM sys.database_permissions q
                          WHERE q.grantee_principal_id = @dst AND q.class = p.class AND q.major_id = p.major_id
                            AND q.minor_id = p.minor_id AND q.permission_name = p.permission_name AND q.state = p.state);
      DECLARE @results TABLE (kind varchar(10), item nvarchar(700), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @kind varchar(10), @item nvarchar(700), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @kind = kind, @item = item, @sql = stmt FROM @items WHERE n = @n;
        BEGIN TRY
          {{exec:@sql}};
          INSERT @results VALUES (@kind, @item, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@kind, @item, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT kind, item, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      IF @max = 0 SELECT N'Nothing to copy: the target already has everything the source has.' AS result;
      ELSE SELECT kind, item AS name, status, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some items failed: see the table.', 1;

  - id: changes.rename_user
    name: "Rename database user (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
        must_exist: true
      - name: new_name
        type: string
        required: true
    checks:
      - id: same_name
        message: "The new name is the same as the current name."
        sql: |
          SELECT 1 WHERE @user_name = @new_name;
      - id: new_name_taken
        message: "A database principal with the new name already exists."
        sql: |
          SELECT 1 WHERE DATABASE_PRINCIPAL_ID(@new_name) IS NOT NULL;
      - id: reserved_name
        message: "The new name is reserved (dbo, guest, sys, INFORMATION_SCHEMA)."
        sql: |
          SELECT 1 WHERE @new_name IN (N'dbo', N'guest', N'sys', N'INFORMATION_SCHEMA');
    sql: |
      -- Guards: fail with a clear message before the DDL instead of a cryptic engine error.
      IF @user_name = @new_name
        THROW 50001, 'New name is the same as the current name.', 1;
      IF LEN(@new_name) > 128
        THROW 50002, 'New name is longer than 128 characters.', 1;
      IF @new_name IN (N'dbo', N'guest', N'sys', N'INFORMATION_SCHEMA')
        THROW 50003, 'New name is a reserved database principal name.', 1;
      IF DATABASE_PRINCIPAL_ID(@user_name) IS NULL
        THROW 50004, 'The user to rename does not exist in this database.', 1;
      IF DATABASE_PRINCIPAL_ID(@new_name) IS NOT NULL
        THROW 50005, 'A database principal with the new name already exists.', 1;

      DECLARE @sql nvarchar(max) = N'ALTER USER ' + QUOTENAME(@user_name) + N' WITH NAME = ' + QUOTENAME(@new_name);
      {{exec:@sql}};
      SELECT name AS user_name, type_desc, modify_date
      FROM sys.database_principals
      WHERE name = @new_name;

  - id: changes.database_roles
    name: "Database roles of a user (checklist, selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: roles_to_drop, not_empty: true }
    params:
      - name: user_name
        type: user
        required: true
        must_exist: true
      - name: roles_to_add
        type: string
        source: database_roles
        depends_on: [user_name]
        multi: true
        required: false
        must_exist: true
        checklist_group: roles
        checklist_action: add
      - name: roles_to_drop
        type: string
        source: database_roles
        depends_on: [user_name]
        multi: true
        required: false
        must_exist: true
        checklist_group: roles
        checklist_action: drop
      # Permissions that are not a role (the roles themselves are in the checklist above). Optional; it only ADDS.
      - name: permission_bundle
        type: choice
        required: false
        default: ""   # blank = no bundle; without a default @permission_bundle is not bound and the script fails
        choices: [execute, developer]
        choice_help:
          execute: "GRANT EXECUTE: run every stored procedure and function of the database."
          developer: "VIEW DEFINITION + EXECUTE + CREATE PROCEDURE, and ALTER on schema dbo."
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      -- Items run one by one: roles to add / drop, then the optional permission bundle (act GRANT).
      DECLARE @q nvarchar(300) = QUOTENAME(@user_name);
      DECLARE @items TABLE (n int IDENTITY(1,1), act varchar(10), item nvarchar(256), stmt nvarchar(max));
      INSERT @items (act, item, stmt) SELECT 'ADD', value, N'ALTER ROLE ' + QUOTENAME(value) + N' ADD MEMBER ' + @q + N';' FROM OPENJSON(@roles_to_add);
      INSERT @items (act, item, stmt) SELECT 'DROP', value, N'ALTER ROLE ' + QUOTENAME(value) + N' DROP MEMBER ' + @q + N';' FROM OPENJSON(@roles_to_drop);
      IF @permission_bundle = N'execute'
        INSERT @items (act, item, stmt) VALUES ('GRANT', N'execute', N'GRANT EXECUTE TO ' + @q + N';');
      IF @permission_bundle = N'developer'
        INSERT @items (act, item, stmt) VALUES ('GRANT', N'developer',
          N'GRANT VIEW DEFINITION, EXECUTE, CREATE PROCEDURE TO ' + @q + N'; GRANT ALTER ON SCHEMA::dbo TO ' + @q + N';');
      DECLARE @results TABLE (item nvarchar(256), act varchar(10), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @act varchar(10), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @act = act, @item = item, @sql = stmt FROM @items WHERE n = @n;
        BEGIN TRY
          {{exec:@sql}};
          INSERT @results VALUES (@item, @act, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, @act, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, act, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS database_role, act AS action, status, message FROM @results;
      SELECT r.name AS database_role_now, m.name AS user_name
      FROM sys.database_role_members drm
      JOIN sys.database_principals r ON r.principal_id = drm.role_principal_id
      JOIN sys.database_principals m ON m.principal_id = drm.member_principal_id
      WHERE m.name = @user_name
      ORDER BY r.name;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some roles failed: see the table.', 1;

  - id: changes.fix_orphaned_user
    name: "Fix orphaned user: remap to a login of another name (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      # Only users whose login SID is gone (lookup orphaned_users), straight from the server.
      - name: user_name
        type: user
        source: orphaned_users
        required: true
        must_exist: true
      - name: login_name
        type: login
        required: false
        must_exist: true
        default: ""
    sql: |
      -- Blank login = the login with the same name as the user.
      DECLARE @l sysname = COALESCE(NULLIF(@login_name, N''), @user_name);
      DECLARE @sql nvarchar(max) = N'ALTER USER ' + QUOTENAME(@user_name) + N' WITH LOGIN = ' + QUOTENAME(@l);
      {{exec:@sql}};
      SELECT u.name AS user_name, sp.name AS mapped_login
      FROM sys.database_principals u
      LEFT JOIN sys.server_principals sp ON sp.sid = u.sid
      WHERE u.name = @user_name;

  - id: changes.fix_orphaned_users
    name: "Fix several orphaned users: remap each to the login of the same name (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      - name: users
        type: string
        source: orphaned_users
        multi: true
        required: true
        must_exist: true
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), item nvarchar(256));
      INSERT @items (item) SELECT value FROM OPENJSON(@users);
      DECLARE @results TABLE (item nvarchar(256), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @item = item FROM @items WHERE n = @n;
        BEGIN TRY
          IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = @item)
            THROW 50020, N'No login with the same name exists on the server (use "remap to a login of another name", or create the login).', 1;
          SET @sql = N'ALTER USER ' + QUOTENAME(@item) + N' WITH LOGIN = ' + QUOTENAME(@item) + N';';
          {{exec:@sql}};
          INSERT @results VALUES (@item, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS user_name, status, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some users failed: see the table.', 1;

  - id: changes.drop_orphaned_users
    name: "Drop orphaned users (selected database)"
    category: changes
    scope: database
    engines: [sqlserver]
    destructive: true
    params:
      - name: users
        type: string
        source: orphaned_users
        multi: true
        required: true
        must_exist: true
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), item nvarchar(256));
      INSERT @items (item) SELECT value FROM OPENJSON(@users);
      DECLARE @results TABLE (item nvarchar(256), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @item = item FROM @items WHERE n = @n;
        BEGIN TRY
          -- DROP USER fails while the user owns a schema: hand those to dbo first.
          SET @sql = N'';
          SELECT @sql += N'ALTER AUTHORIZATION ON SCHEMA::' + QUOTENAME(name) + N' TO dbo;' + NCHAR(10)
          FROM sys.schemas WHERE principal_id = DATABASE_PRINCIPAL_ID(@item);
          SET @sql += N'DROP USER ' + QUOTENAME(@item) + N';';
          {{exec:@sql}};
          INSERT @results VALUES (@item, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS user_name, status, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some users failed: see the table.', 1;

  - id: changes.set_jobs_enabled
    name: "Enable / disable SQL Agent jobs"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    destructive_when: { param: action, values: [DISABLE] }
    params:
      - name: jobs
        type: string
        source: jobs
        multi: true
        required: true
        must_exist: true
      - name: action
        type: choice
        required: true
        choices: [ENABLE, DISABLE]
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), item nvarchar(256));
      INSERT @items (item) SELECT value FROM OPENJSON(@jobs);
      DECLARE @results TABLE (item nvarchar(256), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @item = item FROM @items WHERE n = @n;
        SET @sql = N'EXEC msdb.dbo.sp_update_job @job_name = N' + QUOTENAME(@item, '''')
          + N', @enabled = ' + CASE WHEN @action = N'ENABLE' THEN N'1' ELSE N'0' END + N';';
        BEGIN TRY
          {{exec:@sql}};
          INSERT @results VALUES (@item, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS job_name, status, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some jobs failed: see the table.', 1;

  # Phase 6 "clone permissions", server level. Only ADDS access to the target (roles it lacks, permissions it
  # lacks); it never removes anything, so it needs no confirm token. The source is only read (protect: false).
  - id: changes.clone_server_access
    name: "Clone server access from another login"
    category: changes
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      - name: source_login
        type: login
        required: true
        must_exist: true
        protect: false
      - name: target_login
        type: login
        required: true
        must_exist: true
      - name: include_roles
        type: bool
        required: false
        default: "true"
      - name: include_permissions
        type: bool
        required: false
        default: "true"
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    checks:
      - id: different_logins
        message: "Source and target are the same login."
        sql: |
          SELECT 1 WHERE @source_login = @target_login;
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), kind varchar(10), item nvarchar(256), stmt nvarchar(max));
      IF @include_roles = 1
        INSERT @items (kind, item, stmt)
        SELECT 'ROLE', r.name,
               N'ALTER SERVER ROLE ' + QUOTENAME(r.name) + N' ADD MEMBER ' + QUOTENAME(@target_login) + N';'
        FROM sys.server_role_members srm
        JOIN sys.server_principals r ON r.principal_id = srm.role_principal_id
        JOIN sys.server_principals m ON m.principal_id = srm.member_principal_id
        WHERE m.name = @source_login
          AND NOT EXISTS (SELECT 1 FROM sys.server_role_members x
                          JOIN sys.server_principals t ON t.principal_id = x.member_principal_id
                          WHERE x.role_principal_id = srm.role_principal_id AND t.name = @target_login);
      -- CONNECT SQL is skipped: a login always needs it and the target already has it when it exists.
      IF @include_permissions = 1
        INSERT @items (kind, item, stmt)
        SELECT 'PERMISSION', p.permission_name,
               CASE p.state WHEN 'D' THEN N'DENY ' ELSE N'GRANT ' END + p.permission_name
                 + N' TO ' + QUOTENAME(@target_login)
                 + CASE WHEN p.state = 'W' THEN N' WITH GRANT OPTION' ELSE N'' END + N';'
        FROM sys.server_permissions p
        WHERE p.grantee_principal_id = SUSER_ID(@source_login) AND p.class = 100
          AND p.permission_name <> 'CONNECT SQL'
          AND NOT EXISTS (SELECT 1 FROM sys.server_permissions q
                          WHERE q.grantee_principal_id = SUSER_ID(@target_login) AND q.class = 100
                            AND q.permission_name = p.permission_name AND q.state = p.state);
      DECLARE @results TABLE (kind varchar(10), item nvarchar(256), status varchar(7), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @kind varchar(10), @item nvarchar(256), @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @kind = kind, @item = item, @sql = stmt FROM @items WHERE n = @n;
        BEGIN TRY
          {{exec:@sql}};
          INSERT @results VALUES (@kind, @item, 'OK', NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@kind, @item, 'ERROR', ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT kind, item, 'SKIPPED', NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      IF @max = 0 SELECT N'Nothing to copy: the target already has everything the source has.' AS result;
      ELSE SELECT kind, item AS name, status, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some items failed: see the table.', 1;
