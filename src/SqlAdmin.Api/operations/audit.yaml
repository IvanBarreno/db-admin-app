# operations/audit.yaml — read-only operations (§2 "Audit / read-only" in the plan).
# One file per category; each entry under "operations:" is a full operation, not a fragment.

operations:
  - id: audit.login_status
    name: "Login exists + status"
    category: audit
    scope: server
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      SELECT name AS login_name, type_desc, is_disabled, create_date, modify_date,
             default_database_name
      FROM sys.server_principals
      WHERE name = @login_name;

  - id: audit.server_roles
    name: "Server role memberships"
    category: audit
    scope: server
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      SELECT r.name AS server_role, m.name AS login_name
      FROM sys.server_role_members srm
      JOIN sys.server_principals r ON r.principal_id = srm.role_principal_id
      JOIN sys.server_principals m ON m.principal_id = srm.member_principal_id
      WHERE m.name = @login_name
      ORDER BY r.name;

  - id: audit.database_permissions
    name: "Explicit database permissions for a user"
    category: audit
    scope: database
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
    sql: |
      SELECT dp.permission_name, dp.state_desc, dp.class_desc,
             OBJECT_NAME(dp.major_id) AS object_name
      FROM sys.database_permissions dp
      JOIN sys.database_principals u ON u.principal_id = dp.grantee_principal_id
      WHERE u.name = @user_name
      ORDER BY dp.permission_name;

  - id: audit.server_permissions
    name: "Explicit server permissions for a login"
    category: audit
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      SELECT sp.permission_name, sp.state_desc, sp.class_desc
      FROM sys.server_permissions sp
      JOIN sys.server_principals p ON p.principal_id = sp.grantee_principal_id
      WHERE p.name = @login_name
      ORDER BY sp.permission_name;

  - id: audit.sysadmin_members
    name: "Sysadmin role members"
    category: audit
    scope: server
    engines: [sqlserver]
    destructive: false
    sql: |
      SELECT m.name AS login_name, m.type_desc, m.is_disabled
      FROM sys.server_role_members srm
      JOIN sys.server_principals r ON r.principal_id = srm.role_principal_id
      JOIN sys.server_principals m ON m.principal_id = srm.member_principal_id
      WHERE r.name = N'sysadmin'
      ORDER BY m.name;

  - id: audit.active_sessions
    name: "Active sessions for a login"
    category: audit
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      SELECT session_id, login_time, host_name, program_name, status, last_request_end_time
      FROM sys.dm_exec_sessions
      WHERE login_name = @login_name
      ORDER BY login_time;

  - id: audit.jobs_owned
    name: "SQL Agent jobs owned by a login"
    category: audit
    scope: server
    engines: [sqlserver]   # no SQL Agent on Azure SQL
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      SELECT j.name AS job_name, j.enabled, j.date_created, j.date_modified
      FROM msdb.dbo.sysjobs j
      WHERE SUSER_SNAME(j.owner_sid) = @login_name
      ORDER BY j.name;

  - id: audit.databases_owned
    name: "Databases owned by a login"
    category: audit
    scope: server
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      SELECT name AS database_name, state_desc, recovery_model_desc, create_date
      FROM sys.databases
      WHERE SUSER_SNAME(owner_sid) = @login_name
      ORDER BY name;

  - id: audit.user_mapping
    name: "Database user mapped to a login"
    category: audit
    scope: database
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
    sql: |
      SELECT u.name AS user_name, u.type_desc, u.create_date,
             sp.name AS mapped_login, u.default_schema_name
      FROM sys.database_principals u
      LEFT JOIN sys.server_principals sp ON sp.sid = u.sid
      WHERE u.name = @user_name;

  - id: audit.database_roles
    name: "Database role memberships for a user"
    category: audit
    scope: database
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
    sql: |
      SELECT r.name AS database_role, m.name AS user_name
      FROM sys.database_role_members drm
      JOIN sys.database_principals r ON r.principal_id = drm.role_principal_id
      JOIN sys.database_principals m ON m.principal_id = drm.member_principal_id
      WHERE m.name = @user_name
      ORDER BY r.name;

  - id: audit.database_roles_all
    name: "Users and database roles (all or selected databases)"
    category: audit
    scope: all_databases
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      # Tick logins (all by default = every user, with or without a login); a user matches by its own name or by its login.
      - name: user_names
        type: string
        source: logins
        multi: true
        default_all: true
        required: false
        must_exist: true
      # Optional: look only in these databases (ticked = all online ones; the executor reads this parameter by name).
      - name: databases
        type: string
        source: databases
        multi: true
        default_all: true
        required: false
        must_exist: true
        lock_when:
          - column: state
            not_in: [ONLINE]
            reason: "not online: cannot be read"
    sql: |
      -- LEFT JOINs keep users that hold no role. sys / INFORMATION_SCHEMA are built-in and uninteresting.
      -- SUSER_SNAME(sid) (not sys.server_principals) because Azure SQL Database cannot join to the server catalog.
      SELECT u.name AS user_name, SUSER_SNAME(u.sid) AS login_name, u.type_desc, r.name AS database_role
      FROM sys.database_principals u
      LEFT JOIN sys.database_role_members drm ON drm.member_principal_id = u.principal_id
      LEFT JOIN sys.database_principals r ON r.principal_id = drm.role_principal_id
      WHERE u.type IN ('S', 'U', 'G', 'E', 'X')
        AND u.name NOT IN (N'sys', N'INFORMATION_SCHEMA')
        AND (NOT EXISTS (SELECT 1 FROM OPENJSON(@user_names))
             OR u.name IN (SELECT value FROM OPENJSON(@user_names))
             OR SUSER_SNAME(u.sid) IN (SELECT value FROM OPENJSON(@user_names)))
      ORDER BY u.name, r.name;

  - id: audit.orphaned_users_all
    name: "Orphaned users in all online databases"
    category: audit
    scope: all_databases
    engines: [sqlserver]
    destructive: false
    params:
      - name: databases
        type: string
        source: databases
        multi: true
        default_all: true
        required: false
        must_exist: true
        lock_when:
          - column: state
            not_in: [ONLINE]
            reason: "not online: cannot be read"
    sql: |
      -- SQL users whose login SID is gone, per database. Fix them with "Fix several orphaned users" or
      -- "Drop orphaned users" (select the database there).
      SELECT u.name AS user_name,
             (SELECT TOP 1 sp.name FROM sys.server_principals sp WHERE sp.name = u.name) AS suggested_login,
             u.create_date
      FROM sys.database_principals u
      WHERE u.type = 'S'
        AND u.authentication_type_desc = N'INSTANCE'
        AND u.principal_id > 4
        AND u.sid IS NOT NULL
        AND NOT EXISTS (SELECT 1 FROM sys.server_principals sp WHERE sp.sid = u.sid)
      ORDER BY u.name;

  - id: audit.orphaned_users
    name: "Orphaned users (no matching login)"
    category: audit
    scope: database
    engines: [sqlserver]
    destructive: false
    sql: |
      SELECT u.name AS user_name, u.type_desc, u.create_date
      FROM sys.database_principals u
      LEFT JOIN sys.server_principals sp ON sp.sid = u.sid
      WHERE u.type IN ('S', 'U', 'G')
        AND u.authentication_type_desc IN (N'INSTANCE', N'NONE')
        AND u.principal_id > 4
        AND sp.sid IS NULL
      ORDER BY u.name;

  - id: audit.schema_ownership
    name: "Schemas and objects owned by a user"
    category: audit
    scope: database
    engines: [sqlserver, azuresql]
    destructive: false
    params:
      - name: user_name
        type: user
        required: true
    sql: |
      SELECT N'SCHEMA' AS kind, s.name AS name, NULL AS schema_name
      FROM sys.schemas s
      JOIN sys.database_principals u ON u.principal_id = s.principal_id
      WHERE u.name = @user_name
      UNION ALL
      SELECT o.type_desc, o.name, SCHEMA_NAME(o.schema_id)
      FROM sys.objects o
      JOIN sys.database_principals u ON u.principal_id = o.principal_id
      WHERE u.name = @user_name AND o.is_ms_shipped = 0
      ORDER BY 1, 2;

  # SQL Server's error log, newest first. sys.xp_readerrorlog takes up to two search texts and returns only
  # the lines that contain BOTH; it needs the securityadmin role (or VIEW SERVER STATE on recent versions).
  - id: audit.error_log_search
    name: "Error log search (failed logins…)"
    category: audit
    scope: server
    engines: [sqlserver]   # Azure SQL Database has no error log to read
    destructive: false
    description: "Searches the SQL Server error log, newest lines first. Typical use: failed logins of one account (search for the login name, or for 18456, the failed-login error number)."
    params:
      - name: search_text
        type: string
        required: false
        default: "Login failed"
        label: "Text to find"
        help: "Only lines containing this text are returned. The log is written in the server's language: on a non-English server search for the error number (18456 = login failed) or leave it to the second filter."
      # Not a picker of existing logins on purpose: failed logins are often for accounts that do not exist.
      - name: also_contains
        type: string
        required: false
        default: ""   # an optional parameter needs a default, otherwise @also_contains is never bound
        label: "…and also containing (optional)"
        help: "A second text the same line must contain, e.g. the login name or a client IP address."
      - name: log_number
        type: int
        required: false
        default: "0"
        label: "Log file"
        help: "0 = the current error log, 1 = the previous one, 2 = the one before… (a new file starts at every restart)."
      - name: max_rows
        type: int
        required: false
        default: "200"
        label: "Maximum lines"
        help: "Newest lines first; older matches beyond this number are left out."
    sql: |
      -- The extended procedure wants nvarchar VARIABLES (NULL = no filter), so copy the values first.
      DECLARE @find nvarchar(255) = NULLIF(@search_text, N''),
              @also nvarchar(255) = NULLIF(@also_contains, N'');
      -- INSERT ... EXEC captures the procedure's rows so they can be sorted and limited.
      DECLARE @log TABLE (log_date datetime, process_info nvarchar(100), log_text nvarchar(max));
      INSERT INTO @log (log_date, process_info, log_text)
      EXEC sys.xp_readerrorlog @log_number, 1, @find, @also;
      SELECT TOP (@max_rows) log_date, process_info, log_text
      FROM @log
      ORDER BY log_date DESC;

  # "What can this user REALLY do?" Explicit grants do not tell the whole story (roles, role nesting, DENY,
  # ownership). The reliable answer is to become the user for a moment and ask the engine itself:
  # EXECUTE AS ... fn_my_permissions ... REVERT. Needs IMPERSONATE on the user (sysadmin / db_owner have it).
  - id: audit.effective_permissions
    name: "Effective permissions of a user (test as the user)"
    category: audit
    scope: database
    engines: [sqlserver, azuresql]
    destructive: false
    description: "Shows what a user can actually do in the selected database (or on one object), counting roles and DENYs — by impersonating the user for the duration of the check. Nothing is changed."
    params:
      - name: user_name
        type: user
        required: true
      - name: securable
        type: string
        required: false
        default: ""
        label: "Object (optional)"
        help: "schema.object, e.g. dbo.Customers, to see the permissions on that table, view or procedure. Empty = database-level permissions."
    sql: |
      DECLARE @who sysname = @user_name,
              @object nvarchar(517) = NULLIF(@securable, N''),
              @impersonating bit = 0;
      DECLARE @class nvarchar(60) = CASE WHEN @object IS NULL THEN N'DATABASE' ELSE N'OBJECT' END;
      DECLARE @granted TABLE (entity_name nvarchar(517), subentity_name nvarchar(128), permission_name nvarchar(128));

      IF @object IS NOT NULL AND OBJECT_ID(@object) IS NULL
        THROW 50000, 'The object does not exist in this database (write it as schema.object).', 1;

      BEGIN TRY
        EXECUTE AS USER = @who;          -- from here on we ARE the user...
        SET @impersonating = 1;
        INSERT INTO @granted (entity_name, subentity_name, permission_name)
        SELECT entity_name, subentity_name, permission_name
        FROM sys.fn_my_permissions(@object, @class);
        REVERT;                          -- ...and back to ourselves
        SET @impersonating = 0;
      END TRY
      BEGIN CATCH
        -- Never leave the connection impersonated, whatever went wrong.
        IF @impersonating = 1 REVERT;
        THROW;
      END CATCH;

      SELECT @who AS user_name, @class AS securable_class, entity_name,
             NULLIF(subentity_name, N'') AS column_name, permission_name
      FROM @granted
      ORDER BY entity_name, permission_name, subentity_name;

  - id: audit.effective_server_permissions
    name: "Effective server permissions of a login (test as the login)"
    category: audit
    scope: server
    engines: [sqlserver]   # Azure SQL Database cannot impersonate a server login
    destructive: false
    description: "Shows what a login can actually do at server level, counting its server roles and DENYs — by impersonating the login for the duration of the check. Nothing is changed. Windows groups cannot be impersonated."
    params:
      - name: login_name
        type: login
        required: true
    sql: |
      DECLARE @who sysname = @login_name, @impersonating bit = 0, @is_sysadmin bit;
      DECLARE @granted TABLE (permission_name nvarchar(128));

      BEGIN TRY
        EXECUTE AS LOGIN = @who;
        SET @impersonating = 1;
        INSERT INTO @granted (permission_name)
        SELECT permission_name FROM sys.fn_my_permissions(NULL, N'SERVER');
        SET @is_sysadmin = IS_SRVROLEMEMBER(N'sysadmin');
        REVERT;
        SET @impersonating = 0;
      END TRY
      BEGIN CATCH
        IF @impersonating = 1 REVERT;
        THROW;
      END CATCH;

      SELECT @who AS login_name, @is_sysadmin AS is_sysadmin, permission_name
      FROM @granted
      ORDER BY permission_name;
