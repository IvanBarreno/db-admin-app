# operations/provisioning.yaml — create logins/users and grant access (§2 "Provisioning").
#
# T-SQL cannot take @parameters in DDL (CREATE LOGIN ... PASSWORD = @p is a syntax error), so
# these templates build the statement as dynamic SQL and run it with EXEC. Values still travel
# as bound parameters; QUOTENAME(...) escapes them when they are placed into the statement:
#   QUOTENAME(@name)          -> [name]      (identifiers; NULL if longer than 128 chars)
#   QUOTENAME(@password, '''') -> 'secret'    (string literals; NULL if longer than 128 chars)
# Choice parameters are validated against their declared choices by TemplateRenderer, so they
# can be concatenated directly.
#
# Known limit: the password is part of the dynamic statement text on the server, so it can show
# up in a server-side trace of that statement. It never reaches the audit log (the log stores
# the template with @placeholders, not the values).

operations:
  - id: provisioning.create_sql_login
    name: "Create SQL login"
    category: provisioning
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: string
        required: true
      # Blank = the server generates a strong password and shows it once after the run.
      - name: password
        type: password
        required: false
        generate: true
      - name: default_database
        type: database
        required: false
        default: ""
      - name: check_policy
        type: bool
        required: false
        default: "true"
    checks:
      - id: login_exists
        message: "A login with this name already exists."
        sql: |
          SELECT 1 WHERE EXISTS (SELECT 1 FROM sys.server_principals WHERE name = @login_name);
    sql: |
      IF LEN(@password) > 128 THROW 50000, N'Passwords longer than 128 characters are not supported.', 1;
      DECLARE @sql nvarchar(max) = N'CREATE LOGIN ' + QUOTENAME(@login_name)
        + N' WITH PASSWORD = ' + QUOTENAME(@password, '''')
        + N', CHECK_POLICY = ' + CASE WHEN @check_policy = 1 THEN N'ON' ELSE N'OFF' END
        + CASE WHEN @default_database <> N'' THEN N', DEFAULT_DATABASE = ' + QUOTENAME(@default_database) ELSE N'' END;
      {{exec:@sql}};
      SELECT name AS login_name, type_desc, is_disabled, default_database_name, create_date
      FROM sys.server_principals
      WHERE name = @login_name;

  # Bulk variant: paste a list of names (typed_list), every login gets its own generated password
  # (generate_for_each). Passwords come back in the result grid, only for the logins that were created.
  - id: provisioning.create_sql_logins
    name: "Create several SQL logins (from a list)"
    category: provisioning
    scope: server
    engines: [sqlserver]
    destructive: false
    description: "Creates one SQL login per row. Type a password for a login or leave it empty to have one generated. Generated passwords are shown once in the result table (use Export CSV to hand them over); nothing is stored anywhere."
    params:
      - name: login_names
        type: string
        multi: true
        typed_list: true
        required: true
        label: "Login names"
        help: "One row per login. Names that already exist are reported as errors and nothing is changed for them."
      # One password per name: typed in the row, or generated by the app at execute time when left empty.
      # The form sends only the typed ones ({"login": "password"}); see OperationExecutor.ApplyGeneratedSecrets.
      - name: passwords
        type: password
        required: false
        generate_for_each: login_names
        label: "Passwords"
        help: "Typed per login, or generated by the app when the run starts if left empty. Generated ones are shown once in the results."
      - name: default_database
        type: database
        required: false
        default: ""
      - name: check_policy
        type: bool
        required: false
        default: "true"
      - name: stop_on_error
        type: bool
        required: false
        default: "true"
    sql: |
      DECLARE @items TABLE (n int IDENTITY(1,1), item nvarchar(256));
      INSERT @items (item) SELECT value FROM OPENJSON(@login_names);
      -- From the app: {"login": {"p": "password", "g": true|false}}; g = the app generated it (false = the DBA
      -- typed it). In a dry run the value is masked (not JSON), so it is not read.
      DECLARE @secrets TABLE (item nvarchar(256), secret nvarchar(128), generated bit);
      IF @dry_run = 0
        INSERT @secrets (item, secret, generated)
        SELECT [key], JSON_VALUE([value], '$.p'), CASE WHEN JSON_VALUE([value], '$.g') = N'true' THEN 1 ELSE 0 END
        FROM OPENJSON(@passwords);
      DECLARE @results TABLE (item nvarchar(256), status varchar(7), secret nvarchar(128), message nvarchar(4000));
      DECLARE @n int = 1, @max int = (SELECT COUNT(*) FROM @items), @item nvarchar(256), @secret nvarchar(128),
              @generated bit, @sql nvarchar(max), @failed int = 0;
      WHILE @n <= @max
      BEGIN
        SELECT @item = item FROM @items WHERE n = @n;
        SELECT @secret = NULL, @generated = 0;
        IF @dry_run = 1 SET @secret = N'***';
        ELSE SELECT @secret = secret, @generated = generated FROM @secrets WHERE item = @item;
        BEGIN TRY
          IF LEN(@item) > 128 THROW 50000, N'A login name can have at most 128 characters.', 1;
          IF CHARINDEX(N'\', @item) > 0
            THROW 50000, N'A SQL login name cannot contain a backslash (DOMAIN\name is a Windows login: use "Create Windows login").', 1;
          IF EXISTS (SELECT 1 FROM sys.server_principals WHERE name = @item)
            THROW 50000, N'A login (or server role) with this name already exists.', 1;
          IF @secret IS NULL THROW 50000, N'No password was generated for this login.', 1;
          SET @sql = N'CREATE LOGIN ' + QUOTENAME(@item) + N' WITH PASSWORD = ' + QUOTENAME(@secret, '''')
            + N', CHECK_POLICY = ' + CASE WHEN @check_policy = 1 THEN N'ON' ELSE N'OFF' END
            + CASE WHEN @default_database <> N'' THEN N', DEFAULT_DATABASE = ' + QUOTENAME(@default_database) ELSE N'' END + N';';
          {{exec:@sql}};
          -- The password is reported only here, for a login that was really created, and only when the app
          -- generated it: one the DBA typed is already known and stays off the screen and the CSV.
          INSERT @results VALUES (@item, 'OK',
            CASE WHEN @dry_run = 1 THEN NULL WHEN @generated = 1 THEN @secret ELSE N'(as typed)' END, NULL);
        END TRY
        BEGIN CATCH
          IF @dry_run = 1 SELECT N'-- ' + @item + N': ' + ERROR_MESSAGE() AS statement;
          INSERT @results VALUES (@item, 'ERROR', NULL, ERROR_MESSAGE());
          SET @failed += 1;
          IF @stop_on_error = 1
          BEGIN
            INSERT @results SELECT item, 'SKIPPED', NULL, NULL FROM @items WHERE n > @n;
            BREAK;
          END;
        END CATCH;
        SET @n += 1;
      END;
      SELECT item AS login_name, status, secret AS new_password, message FROM @results;
      IF @dry_run = 0 AND @failed > 0 THROW 50010, N'Some logins were not created: see the table. Logins marked OK exist with the password shown.', 1;

  - id: provisioning.create_windows_login
    name: "Create Windows/AD login"
    category: provisioning
    scope: server
    engines: [sqlserver]
    destructive: false
    params:
      # Written DOMAIN\name. The form offers the server's own domain (and the ones already used by existing
      # Windows logins) as click-to-insert prefixes.
      - name: login_name
        type: string
        required: true
        prefix_lookup: windows_domains
        help: "The Windows account or group, written DOMAIN\\name (for example CONTOSO\\jperez). Click a domain below to insert it."
      - name: default_database
        type: database
        required: false
        default: ""
    checks:
      - id: format
        message: "Write the account as DOMAIN\\name (for example CONTOSO\\jperez)."
        sql: |
          SELECT 1 WHERE CHARINDEX('\', @login_name) <= 1 OR CHARINDEX('\', @login_name) = LEN(@login_name);
      - id: login_exists
        message: "A login with this name already exists."
        sql: |
          SELECT 1 WHERE EXISTS (SELECT 1 FROM sys.server_principals WHERE name = @login_name);
      # CREATE LOGIN ... FROM WINDOWS asks Windows to resolve the account; SUSER_SID does the same question first.
      - id: windows_resolves
        message: "Windows could not find this account (wrong domain or name, or the SQL Server host cannot reach a domain controller): CREATE LOGIN would fail."
        sql: |
          SELECT 1 WHERE CHARINDEX('\', @login_name) > 1 AND SUSER_SID(@login_name) IS NULL;
    sql: |
      DECLARE @sql nvarchar(max) = N'CREATE LOGIN ' + QUOTENAME(@login_name) + N' FROM WINDOWS'
        + CASE WHEN @default_database <> N'' THEN N' WITH DEFAULT_DATABASE = ' + QUOTENAME(@default_database) ELSE N'' END;
      {{exec:@sql}};
      SELECT name AS login_name, type_desc, is_disabled, default_database_name, create_date
      FROM sys.server_principals
      WHERE name = @login_name;

  - id: provisioning.create_user
    name: "Create user for a login (selected database)"
    category: provisioning
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
        must_exist: true
      - name: user_name
        type: string
        required: false
        default: ""
      - name: default_schema
        type: string
        required: false
        default: "dbo"
    sql: |
      DECLARE @u sysname = COALESCE(NULLIF(@user_name, N''), @login_name);
      DECLARE @sql nvarchar(max) = N'CREATE USER ' + QUOTENAME(@u)
        + N' FOR LOGIN ' + QUOTENAME(@login_name)
        + N' WITH DEFAULT_SCHEMA = ' + QUOTENAME(@default_schema);
      {{exec:@sql}};
      SELECT name AS user_name, type_desc, default_schema_name, create_date
      FROM sys.database_principals
      WHERE name = @u;

  # The big one from Users-admin-commands.sql: for every online user database, create the user
  # (or re-map it if it already exists) and add it to the chosen roles. One AuditStep per database.
  - id: provisioning.user_all_databases
    name: "Create/remap user in all online databases + roles"
    category: provisioning
    scope: all_databases
    engines: [sqlserver]
    destructive: false
    params:
      - name: login_name
        type: login
        required: true
        must_exist: true
      - name: user_name
        type: string
        required: false
        default: ""
      - name: add_datareader
        type: bool
        required: false
        default: "true"
      - name: add_datawriter
        type: bool
        required: false
        default: "false"
      - name: grant_execute
        type: bool
        required: false
        default: "false"
      # Limit the run to some databases (ticked = all online ones; read by name by the all_databases executor).
      - name: databases
        type: string
        source: databases
        multi: true
        default_all: true
        required: false
        must_exist: true
        lock_when:
          - column: state
            not_in: [ONLINE]
            reason: "not online: cannot be written to"
    sql: |
      DECLARE @u sysname = COALESCE(NULLIF(@user_name, N''), @login_name);
      DECLARE @sql nvarchar(max);

      IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = @login_name)
        THROW 50000, N'Login does not exist on this server.', 1;

      -- Existing user: re-map it to the login (fixes orphans). Missing user: create it.
      IF EXISTS (SELECT 1 FROM sys.database_principals WHERE name = @u AND type IN ('S', 'U', 'G'))
        SET @sql = N'ALTER USER ' + QUOTENAME(@u) + N' WITH LOGIN = ' + QUOTENAME(@login_name);
      ELSE
        SET @sql = N'CREATE USER ' + QUOTENAME(@u) + N' FOR LOGIN ' + QUOTENAME(@login_name);
      {{exec:@sql}};

      IF @add_datareader = 1
      BEGIN
        SET @sql = N'ALTER ROLE db_datareader ADD MEMBER ' + QUOTENAME(@u);
        {{exec:@sql}};
      END;
      IF @add_datawriter = 1
      BEGIN
        SET @sql = N'ALTER ROLE db_datawriter ADD MEMBER ' + QUOTENAME(@u);
        {{exec:@sql}};
      END;
      IF @grant_execute = 1
      BEGIN
        SET @sql = N'GRANT EXECUTE TO ' + QUOTENAME(@u);
        {{exec:@sql}};
      END;

      SELECT @u AS user_name,
             IS_ROLEMEMBER(N'db_datareader', @u) AS is_datareader,
             IS_ROLEMEMBER(N'db_datawriter', @u) AS is_datawriter;

  - id: provisioning.create_login_for_orphan
    name: "Create a login that takes over an orphaned user's SID (selected database)"
    category: provisioning
    scope: database
    engines: [sqlserver]
    destructive: false
    params:
      # The orphan, straight from the server (lookup orphaned_users).
      - name: user_name
        type: user
        source: orphaned_users
        required: true
        must_exist: true
      # Blank = a login with the same name as the user.
      - name: login_name
        type: string
        required: false
        default: ""
      # Blank = the server generates a strong password and shows it once after the run.
      - name: password
        type: password
        required: false
        generate: true
      - name: check_policy
        type: bool
        required: false
        default: "true"
    checks:
      - id: login_exists
        message: "A login with this name already exists: use \"Fix orphaned user\" to remap the user to it instead."
        sql: |
          SELECT 1 WHERE EXISTS (SELECT 1 FROM sys.server_principals WHERE name = COALESCE(NULLIF(@login_name, N''), @user_name));
    sql: |
      -- The login is created WITH the user's SID, so the user is mapped again without touching the database.
      IF LEN(@password) > 128 THROW 50000, N'Passwords longer than 128 characters are not supported.', 1;
      DECLARE @l sysname = COALESCE(NULLIF(@login_name, N''), @user_name);
      DECLARE @sid varbinary(85) = (SELECT sid FROM sys.database_principals WHERE name = @user_name AND type = 'S');
      IF @sid IS NULL THROW 50021, N'The user does not exist in this database or is not a SQL user.', 1;
      DECLARE @sql nvarchar(max) = N'CREATE LOGIN ' + QUOTENAME(@l)
        + N' WITH PASSWORD = ' + QUOTENAME(@password, '''')
        + N', SID = ' + CONVERT(nvarchar(200), @sid, 1)
        + N', CHECK_POLICY = ' + CASE WHEN @check_policy = 1 THEN N'ON' ELSE N'OFF' END + N';';
      {{exec:@sql}};
      SELECT sp.name AS login_name, sp.type_desc, u.name AS mapped_user
      FROM sys.server_principals sp
      LEFT JOIN sys.database_principals u ON u.sid = sp.sid
      WHERE sp.name = @l;
